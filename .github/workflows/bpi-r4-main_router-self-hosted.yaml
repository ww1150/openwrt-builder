---
name: self-hosted BPI-R4 + main_router packages + GCC15 + 8G RAM

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  #
  #REMOTE_REPOSITORY: ww1150/openwrt
  #REMOTE_BRANCH: main-mt76-fw
  #
  REMOTE_REPOSITORY: openwrt/openwrt
  REMOTE_BRANCH: main
  RELEASE_PREFIX: Mediatek_mt7988a_bpi-r4

jobs:
  check_commits:
    name: Check Commits
    runs-on: ubuntu-24.04
    outputs:
      latest_commit_sha: ${{ steps.get_sha.outputs.latest_commit_sha }}
    steps:
      - name: Checkout remote repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}

      - name: Get the latest commit SHA
        id: get_sha
        run: |
          echo "latest_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "latest_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build OpenWRT for BPI-R4 with BE14 and main-router packages
    needs: [ check_commits ]
    runs-on: self-hosted
    steps:
      #      - name: Install dependencies
      #        run: |
      #          sudo apt update
      #          sudo apt install -y \
      #            build-essential clang flex bison g++ gawk \
      #            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
      #            python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd \
      #            git
      #          sudo apt full-upgrade -y

      - name: Checkout remote repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ needs.check_commits.outputs.latest_commit_sha }}

      - name: Checkout builder configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: builder

      - name: Add custom feeds
        run: |
          echo 'src-git zapret2 https://github.com/remittor/zapret-openwrt.git^124c9f7983dcd6fddf46d3e863fc67853017c4fd' >> feeds.conf.default
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          echo 'src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git^8916e7fe55354771bfc22f854c328db5a9887ec3' >> feeds.conf.default

      - name: Clone single packages
        run: |
          git clone https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon

      - name: Update feeds (with fallback to GitHub mirrors)
        run: |
          if ./scripts/feeds update -a; then
            echo "Successfully updated feeds from official sources."
          else
            echo "Official feeds update failed. Switching to GitHub mirrors and retrying."
            sed -i 's|git.openwrt.org/feed/\(.*\.git\)|github.com/openwrt/\1|' feeds.conf.default
            sed -i 's|git.openwrt.org/project/\(.*\.git\)|github.com/openwrt/\1|' feeds.conf.default
            echo "Updated feeds.conf.default:"
            cat feeds.conf.default
            ./scripts/feeds update -a
          fi

      - name: Patch custom feeds
        run: |
          patch --batch --forward --fuzz=0 -d feeds/zapret2 -p1 < builder/patches/996-zapret2-runtime-fixes.patch
          patch --batch --forward --fuzz=0 -d feeds/passwall2 -p1 < builder/patches/997-passwall2-runtime-fixes.patch
          patch --batch --forward --fuzz=0 -d feeds/passwall2 -p1 < builder/patches/999-passwall2-ignore-wan6-ifup-restart.patch
          ./scripts/feeds update -i zapret2 passwall2

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure firmware image
        run: |
          cat builder/configs/mediatek/mt7988a/bpi-r4 > .config
          cat builder/configs/common/{main-router,snapshot,optimize,sfp} >> .config

      - name: Enable MLO
        run: |
          cat builder/configs/common/mlo >> .config

      - name: Enable openssl
        run: |
          sed -i '/CONFIG_PACKAGE_wpad-mbedtls=y/d' .config
          cat builder/configs/common/openssl >> .config
          cat builder/configs/common/openssl-accel >> .config

      - name: Enable PassWall2
        run: |
          cat builder/configs/common/passwall2 >> .config

      #      - name: Add patches for 4GB WED
      #        run: |
      #          mkdir -p package/kernel/mt76/patches
      #          curl -SL https://github.com/LorenzoBianconi/mt76/commit/35bc8effe9e495ccded5d6722b299dafadce060e.patch > package/kernel/mt76/patches/999-mtk-mt76-mt7996-use-GFP_DMA32-for-page_pool.patch
      #          curl -SL https://github.com/LorenzoBianconi/net-next/commit/93dfca902f0d79126612b8e3cc553b5d891c1f55.patch > target/linux/mediatek/patches-6.12/999-wed-dma-mask-limitation.patch
      #
      #      # From https://github.com/LorenzoBianconi/wireless-next/commit/3e444c68513934d47b019b236ad083c386b0d85b
      #      - name: Copy patches for WED kernel traceback
      #        run: |
      #          curl -SL https://raw.githubusercontent.com/ww1150/openwrt-builder/refs/heads/nhp/patches/999-use-proper-wed-reference-in-wed-kernel.patch > target/linux/mediatek/patches-6.12/999-use-proper-wed-reference-in-wed-kernel.patch
      #          curl -SL https://github.com/LorenzoBianconi/mt76/commit/92f22edf7fd119cde26218a7431919e4cdf1628e.patch > package/kernel/mt76/patches/999-use-proper-wed-reference-in-wed-mt76.patch


      #- name: Enable wolfssl
      #  run: |
      #    sed -i '/CONFIG_PACKAGE_wpad-mbedtls=y/d' .config
      #    curl -SL https://raw.githubusercontent.com/ww1150/openwrt-builder/refs/heads/nhp/configs/common/wolfssl >> .config

      #
      ### EEPROM FIX ###
      #
      ## https://github.com/openwrt/mt76/pull/968
      - name: Use patch from im-0
        run: |
          mkdir -p package/kernel/mt76/patches
          curl --fail -SL https://github.com/openwrt/mt76/commit/aaf90b24fde77a38ee9f0a60d7097ded6a94ad1f.patch > package/kernel/mt76/patches/001-use-tx_power-from-default-fw-if-EEPROM-contains-0s-im-0.patch

      - name: Add librespeed-go
        run: |
          echo "CONFIG_PACKAGE_librespeed-go=y" >> .config

      - name: Run defconfig
        run: |
          make defconfig

      - name: Remove packages that are marked as modules
        run: |
          sed -i -E '/^CONFIG_PACKAGE_libustream-mbedtls=m$/! s/^(CONFIG_[^=]+)=m$/# \1 is not set/' .config

      - name: Patch Image Layout Limits
        run: |
          # Переходим в папку с описанием образов
          IMAGE_MK="target/linux/mediatek/image/filogic.mk"
          
          # Заменяем проверку размера с 44м на 100м
          sed -i 's/check-size 44m/check-size 100m/g' "$IMAGE_MK"
          
          # Заменяем отступ (padding) с 44M на 100M
          # Это самое важное, так как это расширяет место под саму прошивку
          sed -i 's/pad-to 44M/pad-to 100M/g' "$IMAGE_MK"
          sed -i 's/pad-to 44m/pad-to 100m/g' "$IMAGE_MK"
          
          # На всякий случай увеличим размер раздела в конфиге
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> .config

          echo "Verification after patching:"
          grep -E "check-size 100m|pad-to 100M" "$IMAGE_MK"

      - name: Build the firmware image
        run: |
          make defconfig
          make download -j"$(nproc)" || true
          make world -j"$(nproc)"

      - name: Patch the generated image with 8GB bl2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding and unpacking the generated SD card image..."
          IMAGE_DIR="bin/targets/mediatek/filogic"
          GZ_IMAGE_FILE="$IMAGE_DIR/openwrt-mediatek-filogic-bananapi_bpi-r4-sdcard.img.gz"
          test -s "$GZ_IMAGE_FILE"
          gunzip -f "$GZ_IMAGE_FILE"
          IMAGE_FILE="${GZ_IMAGE_FILE%.gz}"

          echo "Fetching the LATEST 8GB bl2 from Frank-w's releases via GitHub API..."
          
          LATEST_RELEASE_INFO=$(curl --fail -sS -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/frank-w/u-boot/releases/latest")
          
          BL2_DOWNLOAD_URL=$(echo "$LATEST_RELEASE_INFO" | jq -r '.assets[] | select(.name == "bpi-r4_sdmmc_8GB_bl2.img") | .browser_download_url')

          if [ -z "$BL2_DOWNLOAD_URL" ] || [ "$BL2_DOWNLOAD_URL" == "null" ]; then
            echo "::error::Could not find 'bpi-r4_sdmmc_8GB_bl2.img' in the latest release!"
            exit 1
          fi
          
          echo "Found download URL: $BL2_DOWNLOAD_URL"
          
          wget -O bpi-r4_sdmmc_8GB_bl2.img "$BL2_DOWNLOAD_URL"
          # BL2 must fit before the ubootenv partition at 4 MiB.
          BL2_SIZE=$(stat -c %s bpi-r4_sdmmc_8GB_bl2.img)
          test "$BL2_SIZE" -gt 0
          test "$BL2_SIZE" -le $((4 * 1024 * 1024 - 17408))
          
          echo "Patching the image using dd with fixed offset (17408 bytes)..."
          # Смещение 17408 байт = 34 сектора * 512 байт/сектор
          OFFSET=17408
          
          dd if=bpi-r4_sdmmc_8GB_bl2.img of="$IMAGE_FILE" bs=1 seek="$OFFSET" conv=notrunc
          
          echo "Repacking the patched image..."
          gzip -f9 "$IMAGE_FILE"

          echo "Image successfully patched."

      - name: Record config and final image checksums
        run: |
          cp .config bin/targets/mediatek/filogic/config-full
          # The SD image was modified after OpenWrt generated sha256sums.
          (
            cd bin/targets/mediatek/filogic
            find . -maxdepth 1 -type f ! -name sha256sums -print0 |
              sort -z | xargs -0 sha256sum > sha256sums
            sha256sum -c sha256sums
          )

      - name: Package output
        run: tar -cvf bpi_r4-images.tar --exclude=packages --exclude=kernels bin/targets/mediatek/filogic

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bpi_r4-images
          path: bpi_r4-images.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    name: Create release
    needs: [ build, check_commits ]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bpi_r4-images

      - name: Extract artifacts
        run: tar xf bpi_r4-images.tar

      - name: Get current date
        run: echo "RELEASE_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: bin/targets/mediatek/filogic/*
          tag_name: ${{ env.RELEASE_PREFIX }}-${{ env.REMOTE_BRANCH }}-${{ env.RELEASE_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: OpenWRT BPI-R4 + MLO + main_router packages + GCC15 + 8G RAM - ${{ env.REMOTE_BRANCH }} - ${{ env.RELEASE_DATE }}
          body: |
            Updated prebuilt images with main_router packages, patches for working 4GB RAM WED build with GCC14 - ${{ env.RELEASE_DATE }},
            Build Commit: ${{ needs.check_commits.outputs.latest_commit_sha }}
            Builder Commit: ${{ github.sha }}

      - name: Clean up old releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: false
          delete_tag_pattern: ${{ env.RELEASE_PREFIX }}-${{ env.REMOTE_BRANCH }}-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
